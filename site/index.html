<script>

].join("").split("|").map(s=>{const[n,c]=s.split(":");return{n,c}});

const $=i=>document.getElementById(i);
const store={};
const gs=k=>{try{return localStorage.getItem(k)}catch(e){return store[k]??null}};
const ss=(k,v)=>{store[k]=v;try{localStorage.setItem(k,v)}catch(e){}};
const rm=k=>{delete store[k];try{localStorage.removeItem(k)}catch(e){}};
const fmt=n=>Number(n).toLocaleString("en");

const T=k=>L[lang][k];

// ---- Sounds (generated in the browser, soft volume, can be muted) ----
let mute=gs("mu")=="1",AC=null;
function snd(type){
  if(mute)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state=="suspended")AC.resume();
    const q={tap:[[660,.05,0]],ok:[[523,.12,0],[659,.12,.1],[784,.22,.2]],err:[[220,.12,0],[185,.2,.13]],win:[[523,.12,0],[659,.12,.12],[784,.12,.24],[1047,.4,.36]],pop:[[880,.06,0],[1175,.09,.07]]}[type];
    q.forEach(([f,d,t])=>{
      const o=AC.createOscillator(),g=AC.createGain(),st=AC.currentTime+t;
      o.type=type=="err"?"triangle":"sine";o.frequency.value=f;
      g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(.1,st+.01);g.gain.exponentialRampToValueAtTime(.0001,st+d);
      o.connect(g);g.connect(AC.destination);o.start(st);o.stop(st+d+.03);
    });
  }catch(e){}
}

// ---- Storage layer: Supabase if configured, otherwise local demo ----
const remote=!!(CONFIG.url&&CONFIG.key);
const loadL=()=>{try{return JSON.parse(gs("wc")||"[]")}catch(e){return[]}};
async function api(path,body){
  const r=await fetch(CONFIG.url+"/rest/v1/"+path,{method:"POST",headers:{apikey:CONFIG.key,"Content-Type":"application/json",...(CONFIG.key.startsWith("eyJ")?{Authorization:"Bearer "+CONFIG.key}:{})},body:JSON.stringify(body)});
  if(r.status===409)throw"exists";
  if(!r.ok)throw"net";
  const t=await r.text();return t?JSON.parse(t):null;
}
async function status(){
  if(remote)return await api("rpc/get_status",{});
  const l=loadL(),g=+(gs("wg")||5000),r=gs("wr")=="1";
  return{goal:g,count:l.length,released:r,open:r||l.length>=g};
}
async function register(name,phone){
  if(remote){await api("contacts",{name,phone});return}
  const l=loadL();if(l.some(x=>x.phone===phone))throw"exists";
  l.push({name,phone});ss("wc",JSON.stringify(l));
}
async function checkUser(n,p){
  if(remote)return await api("rpc/check_user",{p_name:n,p_phone:p});
  return loadL().some(x=>x.phone===p&&x.name.toLowerCase()===n.toLowerCase());
}
async function getContacts(n,p){
  if(remote)return(await api("rpc/get_contacts",{p_name:n,p_phone:p}))||[];
  return(await status()).open&&await checkUser(n,p)?loadL():[];
}
const adminCheck=async p=>remote?await api("rpc/admin_check",{p}):p=="admin";
const adminList=async p=>remote?(await api("rpc/admin_contacts",{p}))||[]:loadL();
async function adminSet(p,g,r){
  if(remote){await api("rpc/admin_set",{p,g,r});return}
  ss("wg",String(g));ss("wr",r?"1":"0");
}

// ---- VCF ----
const pf=n=>n.startsWith(OWNER.prefix)?n:OWNER.prefix+" "+n; // S.S.O prefix
const esc=s=>s.replace(/[\\;,]/g,m=>"\\"+m).replace(/[\r\n]+/g," ");
const vcf=l=>l.map(x=>"BEGIN:VCARD\r\nVERSION:3.0\r\nFN:"+esc(pf(x.name))+"\r\nN:"+esc(pf(x.name))+";;;;\r\nTEL;TYPE=CELL:"+x.phone+"\r\nEND:VCARD").join("\r\n")+"\r\n";
function download(l,fn="contacts.vcf"){
  const b=new Blob([vcf(l)],{type:"text/vcard;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fn;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

// ---- Progress bar ----
let S={goal:5000,count:0,released:false,open:false},shown=0,ready=false;
function tween(a,b){const t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/700);$("cn").textContent=fmt(Math.round(a+(b-a)*k));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function upd(s){
  if(ready){if(s.open&&!S.open)snd("win");else if(s.count>S.count)snd("pop")}
  S=s;
  const pct=s.goal?Math.min(100,s.count/s.goal*100):0;
  $("top").classList.toggle("open",!!s.open);
  $("ico").textContent=s.open?"🎉":"🔒";
  $("pmsg").textContent=s.open?T("po"):T("pm").replace("{g}",fmt(s.goal));
  $("fill").style.width=(s.count>0?Math.max(pct,2):0)+"%";
  $("bar").setAttribute("aria-valuenow",Math.round(pct));
  $("gl").textContent=fmt(s.goal);$("pc").textContent=Math.floor(pct)+"%";
  tween(shown,s.count);shown=s.count;
  renderDone();renderAdmin();
}
async function refresh(){try{upd(await status())}catch(e){}}

// ---- UI helpers ----
$("lg").innerHTML=Object.keys(N).map(k=>`<option value="${k}">${N[k]}</option>`).join("");
// ---- Countries & phone numbers (library = every country, exact rules per country) ----
const LPH=()=>window.libphonenumber;
const flag=i=>String.fromCodePoint(...[...i].map(c=>127397+c.charCodeAt(0)));
let COUNTRIES=[];
function buildCountries(){
  const lp=LPH(),cur=$("cc").value||(lp?"CM":"0"); // Cameroon (+237) by default
  if(lp){
    let dn=null;try{dn=new Intl.DisplayNames([lang],{type:"region"})}catch(e){}
    COUNTRIES=lp.getCountries().map(i=>{let n=i;try{n=(dn&&dn.of(i))||i}catch(e){}return{i,n,c:lp.getCountryCallingCode(i)}}).sort((a,b)=>a.n.localeCompare(b.n,lang));
  }else COUNTRIES=C.map((x,i)=>({i:String(i),n:x.n,c:x.c}));
  const sel=$("cc");sel.textContent="";
  COUNTRIES.forEach(x=>sel.add(new Option((lp?flag(x.i)+" ":"")+x.n+" (+"+x.c+")",x.i)));
  sel.value=COUNTRIES.some(x=>x.i==cur)?cur:(lp?"CM":"0");
}
// Returns {ok, e164, intl}. Accepts national format (0 / 8 prefixes), "+code" format, or code typed by mistake.
function normPhone(raw,iso){
  const lp=LPH();
  if(lp){
    try{
      const pn=lp.parsePhoneNumberFromString(String(raw),iso);
      if(pn&&(PHONE_STRICT?pn.isValid():pn.isPossible()))return{ok:true,e164:pn.number,intl:pn.formatInternational()};
    }catch(e){}
    return{ok:false};
  }
  // fallback if the library did not load: basic length check only
  const c=(COUNTRIES.find(x=>x.i==iso)||{}).c||"";
  let d=String(raw).replace(/\D/g,"").replace(/^0+/,"");
  if(d.startsWith(c)&&d.length-c.length>=9)d=d.slice(c.length);
  if(d.length<6||d.length+c.length>15)return{ok:false};
  return{ok:true,e164:"+"+c+d,intl:"+"+c+" "+d};
}
function showPv(){const r=normPhone($("ph").value,$("cc").value);$("pvw").textContent=r.ok?"✓ "+r.intl:""}
$("demo").hidden=remote;

function show(n){
  [1,2,3,4].forEach(i=>$("v"+i).hidden=i!=n);
  $("v"+n).style.animation="none";void $("v"+n).offsetWidth;$("v"+n).style.animation="";
  scrollTo({top:0,behavior:"smooth"});
}
function setMode(m){
  mode=m;
  $("tr").classList.toggle("on",m=="r");$("ts").classList.toggle("on",m=="s");
  $("cw").hidden=$("hint").hidden=m!="r";
  $("go").textContent=T(m=="r"?"goR":"goS");
  $("er").textContent="";
}
function renderDone(){
  if(!sess)return;
  const r=Math.max(0,S.goal-S.count);
  $("lk").textContent=S.open?T("po"):T("lk").replace("{g}",fmt(S.goal)).replace("{r}",fmt(r));
  $("dl").disabled=!S.open;
  $("dl").textContent=(S.open?"⬇️ ":"🔒 ")+T("dl");
  $("how").hidden=!S.open;
}
function fill(){
  $("hi").textContent=T("hi").replace("{n}",sess.name);
  $("cr").textContent=sess.name+" · "+sess.phone;
  renderDone();
}
function apply(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang=="ar"?"rtl":"ltr";
  $("lg").value=lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=T(e.dataset.i));
  buildCountries();showPv();setMode(mode);upd(S);renderAd();renderClause();
  if(sess)fill();
}
function fail(el,k){
  snd("err");
  $("er").textContent=T(k)+(k=="ePh"?" "+T("ePc"):"");
  el.classList.add("bad");
  const s=$("v1");s.classList.remove("shake");void s.offsetWidth;s.classList.add("shake");
  if(el.focus&&el.tagName=="INPUT"&&el.type!="checkbox")el.focus();
}

// ---- Events ----
$("lg").onchange=e=>{lang=e.target.value;ss("lg",lang);apply()};
$("tr").onclick=()=>setMode("r");
$("ts").onclick=()=>setMode("s");
$("ph").oninput=e=>{
  const el=e.target,lp=LPH(),end=el.selectionStart==el.value.length;
  if(lp){if(end){try{el.value=new lp.AsYouType($("cc").value).input(el.value)}catch(_){}}}
  else if(end)el.value=el.value.replace(/\D/g,"").replace(/(\d{3})(?=\d)/g,"$1 ");
  showPv();
};
$("cc").onchange=()=>$("ph").dispatchEvent(new Event("input",{bubbles:true}));
document.addEventListener("input",e=>{
  e.target.classList.remove("bad");$("cw").classList.remove("bad");$("er").textContent="";
});
document.addEventListener("keydown",e=>{
  if(e.key!="Enter"||e.target.tagName!="INPUT"||e.target.type=="checkbox")return;
  if(e.target.id=="ap")$("al").click();else if(!$("v1").hidden)$("go").click();
});

$("go").onclick=async()=>{
  $("er").textContent="";
  const nm=$("nm").value.trim().replace(/\s+/g," ");
  const r=normPhone($("ph").value,$("cc").value);
  if(nm.length<2)return fail($("nm"),"eNm");
  if(!r.ok)return fail($("ph"),"ePh");
  if(mode=="r"&&!$("ck").checked){$("cw").classList.add("bad");return fail($("cw"),"eCk")}
  const phone=r.e164,b=$("go");
  b.classList.add("ld");b.disabled=true;
  try{
    if(mode=="r")await register(nm,phone);
    else if(!(await checkUser(nm,phone)))throw"nf";
    sess={name:nm,phone};ss("ss",JSON.stringify(sess));
    await refresh();fill();show(2);snd("ok");
  }catch(e){
    if(e=="exists"){setMode("s");fail($("nm"),"eEx")}
    else fail(e=="nf"?$("nm"):$("go"),e=="nf"?"eNf":"eNet");
  }
  b.classList.remove("ld");b.disabled=false;
};

$("dl").onclick=async()=>{
  const b=$("dl");b.classList.add("ld");
  try{const l=await getContacts(sess.name,sess.phone);if(!l.length)throw 0;download(l);snd("ok")}
  catch(e){$("lk").textContent=T("eNet")}
  b.classList.remove("ld");
};
$("sh").onclick=()=>{
  const base=OWNER.share||(/^https?:/.test(location.protocol)?location.origin+location.pathname:location.href);
  const u=base.split("#")[0].split("?")[0].replace(/index\.html$/,"");
  const t=T("shT").replace("{u}","").trim()+"\n\n"+u; // link alone on its own line
  window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank");
};
$("out").onclick=()=>{sess=null;rm("ss");$("ph").value="";$("ck").checked=false;setMode("s");show(1)};

// ---- Admin (French) ----
function renderAdmin(){
  if(!adm)return;
  const pct=S.goal?Math.floor(Math.min(100,S.count/S.goal*100)):0;
  $("as").textContent=(S.open?"🔓 VCF téléchargeable par tous":"🔒 VCF verrouillé")+" · "+fmt(S.count)+" / "+fmt(S.goal)+" ("+pct+"%)";
}
function fillAdmin(){$("ag").value=S.goal;$("ar").checked=!!S.released;$("alist").hidden=true;$("am").textContent="";renderAdmin()}
function renderList(){
  const q=$("aq").value.trim().toLowerCase();
  const m=alist.filter(x=>!q||x.name.toLowerCase().includes(q)||x.phone.includes(q));
  const tb=$("tb");tb.textContent="";
  m.slice(0,200).forEach(x=>{
    const r=document.createElement("div");r.className="r";
    const a=document.createElement("span");a.textContent=pf(x.name);
    const p=document.createElement("span");p.textContent=x.phone;p.dir="ltr";
    const d=document.createElement("button");d.textContent="🗑";d.className="del";d.title="Supprimer";
    d.onclick=async()=>{
      if(!confirm("Supprimer "+pf(x.name)+" ("+x.phone+") ?"))return;
      try{await adminDelete(adm,x.phone);alist=alist.filter(y=>y.phone!==x.phone);renderList();await refresh();$("am").textContent="✅ Contact supprimé"}
      catch(e){$("am").textContent="❌ Suppression impossible."}
    };
    r.append(a,p,d);tb.append(r);
  });
  $("ac").textContent=m.length+" / "+alist.length+" contacts"+(m.length>200?" (200 premiers affichés, utilisez la recherche)":"");
}
$("adm").onclick=()=>{if(adm){fillAdmin();show(4)}else show(3)};
$("ab").onclick=()=>show(sess?2:1);
$("aout").onclick=()=>{adm=null;show(sess?2:1)};
$("al").onclick=async()=>{
  const p=$("ap").value;if(!p)return;
  const b=$("al");b.classList.add("ld");$("ae").textContent="";
  try{if(!(await adminCheck(p)))throw"bad";adm=p;$("ap").value="";await refresh();fillAdmin();show(4)}
  catch(e){$("ae").textContent=e=="bad"?"Mot de passe incorrect.":"Problème de connexion."}
  b.classList.remove("ld");
};
$("asv").onclick=async()=>{
  const g=parseInt($("ag").value,10),b=$("asv");
  if(!(g>0))return $("am").textContent="Objectif invalide.";
  b.classList.add("ld");
  try{await adminSet(adm,g,$("ar").checked);await refresh();$("am").textContent="✅ Enregistré"}
  catch(e){$("am").textContent="❌ Échec de l'enregistrement."}
  b.classList.remove("ld");
};
$("adl").onclick=async()=>{
  const b=$("adl");b.classList.add("ld");
  try{const l=await adminList(adm);if(!l.length)$("am").textContent="Aucun contact pour le moment.";else{download(l,"contacts-admin.vcf");$("am").textContent="✅ "+l.length+" contacts téléchargés"}}
  catch(e){$("am").textContent="❌ Échec du téléchargement."}
  b.classList.remove("ld");
};
$("avw").onclick=async()=>{
  const b=$("avw");b.classList.add("ld");
  try{alist=await adminList(adm);$("alist").hidden=false;renderList()}
  catch(e){$("am").textContent="❌ Impossible de charger les contacts."}
  b.classList.remove("ld");
};
